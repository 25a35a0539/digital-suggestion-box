<!DOCTYPE html>
<html>
<head>
    <title>Digital Suggestion Box</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 380px;
            background: white;
            padding: 20px;
            margin: 60px auto;
            border-radius: 10px;
            box-shadow: 2px 2px 8px gray;
            position: relative;
        }

        h1 {
            color: #333;
        }

        /* Suggestion Box Image */
        .box-img {
            width: 150px;
            margin: 10px 0;
        }

        /* Paper Animation */
        .paper {
            width: 40px;
            height: 30px;
            background: white;
            border: 1px solid black;
            position: absolute;
            top: 0;
            left: 170px;
            display: none;
        }

        @keyframes drop {
            0% { top: 0; opacity: 1; }
            100% { top: 120px; opacity: 0; }
        }

        input, textarea {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        textarea {
            height: 80px;
        }

        button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e7e34;
        }

        #formPage {
            display: none;
        }

        #message {
            color: green;
            margin-top: 10px;
            display: none;
        }

    </style>
</head>
<body>

<div class="container" id="welcomePage">
    <h1>Digital Suggestion Box</h1>

    <!-- Real Suggestion Box Image -->
    <img class="box-img" 
    src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png">

    <p>Drop your ideas into the box!</p>
    <button onclick="openForm()">Give Suggestion</button>
</div>

<div class="container" id="formPage">
    <h2>Submit Suggestion</h2>

    <!-- Paper element -->
    <div class="paper" id="paper"></div>

    <input type="text" placeholder="Enter your name (optional)">
    <br>

    <textarea id="suggestion" placeholder="Write your suggestion"></textarea>
    <br>

    <button onclick="submitSuggestion()">Submit</button>

    <p id="message">Suggestion Submitted Successfully!</p>
</div>

<script>

function openForm() {
    document.getElementById("welcomePage").style.display = "none";
    document.getElementById("formPage").style.display = "block";
}

function submitSuggestion() {
    var text = document.getElementById("suggestion").value;

    if(text == "") {
        alert("Please enter your suggestion!");
        return;
    }

    var paper = document.getElementById("paper");
    paper.style.display = "block";
    paper.style.animation = "drop 1s forwards";

    setTimeout(function(){
        document.getElementById("message").style.display = "block";
        document.getElementById("suggestion").value = "";
        paper.style.display = "none";
        paper.style.animation = "";
    }, 1000);
}

</script>

</body>
</html>
